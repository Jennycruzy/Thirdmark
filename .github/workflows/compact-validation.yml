name: Compact validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  full-proof-compile:
    name: Full Compact proof-key compile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Compact CLI
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install pinned Compact toolchain
        run: compact update 0.30.0

      - name: Compile reference and OPRF circuits with proving keys
        run: ./scripts/verify-compact.sh
