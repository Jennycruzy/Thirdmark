version: 2.1

jobs:
  compact-validation:
    docker:
      - image: cimg/node:24.11
    resource_class: medium
    environment:
      COMPACT_ARTIFACT_ROOT: /tmp/thirdmark-compact-artifacts
    steps:
      - checkout

      - run:
          name: Install validation dependencies
          command: |
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ca-certificates ripgrep

      - run:
          name: Install Compact CLI
          command: |
            curl --proto '=https' --tlsv1.2 -LsSf \
              https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"

      - run:
          name: Install pinned Compact toolchain
          command: compact update 0.30.0

      - run:
          name: Compile reference and OPRF circuits with proving keys
          command: ./scripts/verify-compact.sh

      - store_artifacts:
          path: /tmp/thirdmark-compact-artifacts
          destination: compact-artifacts

      - run:
          name: Install simulator dependencies
          command: npm ci --legacy-peer-deps

      - run:
          name: Run contract simulator tests
          command: npm test

      - run:
          name: Typecheck browser interface
          command: npm run web:typecheck

      - run:
          name: Build browser interface
          command: npm run web:build

workflows:
  compact-validation:
    jobs:
      - compact-validation
